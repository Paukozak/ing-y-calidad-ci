<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 1.5rem;
      }

      .card {
        background-color: #ffffff;
        padding: 3rem;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        text-align: center;
        max-width: 800px;
        width: 90%;
        animation: fade-in 0.6s ease-out;
      }

      .badge {
        display: inline-block;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 0.35rem 0.9rem;
        border-radius: 999px;
        margin-bottom: 1.25rem;
      }

      h1 {
        background: linear-gradient(135deg, #667eea, #764ba2);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        font-size: 2.75rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
      }
      h2 {
        color: #718096;
        font-size: 1.2rem;
        font-weight: 600;
        margin-bottom: 1.5rem;
      }
      p {
        color: #4a5568;
        line-height: 1.7;
        margin-bottom: 0.8rem;
        font-size: 1.1rem;
        font-weight: 400;
      }
      .highlight {
        font-weight: 600;
        color: #667eea;
      }


      .image-placeholder {
        margin-top: 1.5rem;
        width: 100%;
        max-width: 700px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        display: block;
        margin-left: auto;
        margin-right: auto;
        transition: transform 0.3s ease;
      }
      .image-placeholder:hover {
        transform: scale(1.02);
      }

      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>

    <div class="card">
      <span class="badge">CI / CD</span>
      <h1>2do Parcial</h1>
      <h2>Ingeniería y Calidad de Software</h2>
      <p>Este proyecto usa Integración Continua y Entrega Continua con <span class="highlight">GitHub Actions</span>, <span class="highlight">SonarCloud</span>, <span class="highlight">Slack</span> y despliegue automático en <span class="highlight">Vercel</span>. Los tests se ejecutan con <span class="highlight">Node.js</span> siguiendo <span class="highlight">Spec Driven Development</span>.</p>
      <img
        class="image-placeholder"
        src="ci_cd_ingycalidad.png"
        alt="Foto CI/CD Ingeniería y Calidad"
      />
    </div>

  </body>
</html>
