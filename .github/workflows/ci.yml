name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"

      - name: Correr los tests
        id: tests
        run: node test/test.js
        continue-on-error: true

      - name: Notificar fallo de tests a Slack
        if: steps.tests.outcome == 'failure'
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          -H 'Content-type: application/json' \
          --data '{"text":"❌ Fallaron los tests! No se va a deployar.\nRepositorio: ${{ github.repository }}\nCommit: ${{ github.sha }}"}'

      - name: Fallar el job si los tests fallaron
        if: steps.tests.outcome == 'failure'
        run: exit 1

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Obtener el código
        uses: actions/checkout@v3

      - name: Deploy a Vercel
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

      - name: Notificar deploy exitoso a Slack
        if: success()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          -H 'Content-type: application/json' \
          --data '{"text":"✅ Deploy exitoso a producción!\nRepositorio: ${{ github.repository }}\nCommit: ${{ github.sha }}"}'

      - name: Notificar fallo a Slack
        if: failure()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          -H 'Content-type: application/json' \
          --data '{"text":"❌ Falló el pipeline!\nRepositorio: ${{ github.repository }}\nCommit: ${{ github.sha }}"}'